<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">Red Tunic 5.0.0 — a native PC journey back to Hyrule</title>
<desc id="desc">Original fantasy-inspired artwork with a crimson cloak emblem, ember-lit forest, AMD Radeon iGPU tuning, and Steam Deck and Linux handheld focus. Steam Deck performance testing is pending.</desc>
